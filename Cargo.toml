[package]
name = "xmip-core-sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-sdk"
description = "Simulators and emulators: the media a module is tested on, in process — a serial multi-drop bus first (ADR-0061)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The line a simulated bus is, and the failures it answers in: the transport
# capability's, which every technology on a simulated medium already uses.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

[lints.rust]
# A simulator has no business writing unsafe.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
