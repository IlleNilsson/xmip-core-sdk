# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — doc/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-core-sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-sdk"
description = "What a provider builds against: every trait a module implements, and the export over the C ABI's tables (ADR-0061)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Inside the estate the SDK tracks main like every crate (ADR-0021); a provider
# outside it pins a tag, sdk-v<major>.<minor>.<patch> (ADR-0061).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
# The C boundary the export stands on: the header's tables, mirrored in Rust
# (ADR-0061, decision 4).
xmip_core_abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }

[lints.rust]
# deny, not forbid: the export modules stand on the far side of the C boundary
# and allow it, each block with a SAFETY comment (ADR-0061, decision 8).
# Everything else in the SDK writes none, and a provider's crate forbids it.
unsafe_code = "deny"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
